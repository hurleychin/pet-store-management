<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('服务项目')"></head>
<body>
<div class="layout">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/header :: header"></header>
    <div class="content">
      <div th:replace="fragments/header :: flash"></div>
      <h1 class="page-title">服务项目 <span class="sub">体型四档价：小 / 中 / 大 / 巨型</span></h1>

      <!-- 服务分类快捷条：按排序号列出全部分类（含隐藏），管理员可进入「修改美容洗护分类」 -->
      <div class="tabs" id="categoryBar">
        <a th:each="c : ${categories}" href="javascript:void(0)" class="cat-chip">
          <b th:text="${c.name}">精洗</b>
          <span class="small muted" th:text="' · ' + ${ui.degree(c.degree)}"> · 洗护类</span>
          <span th:if="${!c.isVisible}" class="badge warn">隐藏</span>
        </a>
        <span th:if="${#lists.isEmpty(categories)}" class="small muted">还没有服务分类</span>
        <a th:if="${session.sessionUser.isAdmin()}" href="#categoryAdmin" class="cat-chip">修改美容洗护分类</a>
      </div>

      <div class="card" id="categoryAdmin" th:if="${session.sessionUser.isAdmin()}">
        <div class="card-head"><span>修改美容洗护分类</span></div>
        <div class="card-body flush">
          <table class="tbl">
            <thead><tr><th>排序</th><th>名称</th><th>服务大类</th><th>状态</th><th style="width:420px">操作</th></tr></thead>
            <tbody>
              <tr th:each="c : ${categories}">
                <td class="num" th:text="${c.sortNo}"></td>
                <td><b th:text="${c.name}"></b></td>
                <td th:text="${ui.degree(c.degree)}"></td>
                <td><span class="badge" th:classappend="${c.isVisible} ? 'ok' : 'warn'" th:text="${c.isVisible} ? '显示' : '隐藏'"></span></td>
                <td class="actions">
                  <form method="post" th:action="@{/services/categories/{id}/move(id=${c.id})}" style="display:inline">
                    <input type="hidden" name="dir" value="up"><button class="btn ghost sm" title="上移">↑</button>
                  </form>
                  <form method="post" th:action="@{/services/categories/{id}/move(id=${c.id})}" style="display:inline">
                    <input type="hidden" name="dir" value="down"><button class="btn ghost sm" title="下移">↓</button>
                  </form>
                  <form method="post" th:action="@{/services/categories/{id}/visibility(id=${c.id})}" style="display:inline">
                    <input type="hidden" name="visible" th:value="${c.isVisible} ? 'false' : 'true'">
                    <button class="btn ghost sm" th:text="${c.isVisible} ? '隐藏' : '显示'"></button>
                  </form>
                  <form method="post" th:action="@{/services/categories/{id}/delete(id=${c.id})}" style="display:inline"
                        onsubmit="return confirmAct('删除该服务分类？已被价格格子或美容单项引用时不能删除。')">
                    <button class="btn danger sm">删除</button>
                  </form>
                  <button class="btn ghost sm" type="button"
                          th:attr="onclick='document.getElementById(\'cat-edit-' + ${c.id} + '\').showModal()'">编辑</button>
                  <dialog class="modal" th:id="'cat-edit-' + ${c.id}">
                    <form method="post" th:action="@{/services/categories/save}">
                      <div class="card-head"><span>编辑服务分类</span></div>
                      <div class="card-body">
                        <input type="hidden" name="id" th:value="${c.id}">
                        <div class="form-grid">
                          <div class="field"><label>名称 *</label><input name="name" required th:value="${c.name}"></div>
                          <div class="field"><label>服务大类 *</label>
                            <select name="degree">
                              <option value="SHOWER" th:selected="${c.degree == 'SHOWER'}">洗护类</option>
                              <option value="BEAUTY" th:selected="${c.degree == 'BEAUTY'}">美容类</option>
                            </select>
                          </div>
                        </div>
                        <div class="mt16">
                          <button class="btn" type="submit">保存</button>
                          <button class="btn ghost" type="button"
                                  th:attr="onclick='document.getElementById(\'cat-edit-' + ${c.id} + '\').close()'">取消</button>
                        </div>
                      </div>
                    </form>
                  </dialog>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categories)}"><td colspan="5" class="muted">还没有服务分类</td></tr>
            </tbody>
          </table>
          <div class="card-body">
            <form method="post" th:action="@{/services/categories/save}" class="inline-form">
              <div class="form-grid">
                <div class="field"><label>新增分类名称 *</label><input name="name" required placeholder="精洗 / 剪毛造型 / 药浴"></div>
                <div class="field"><label>服务大类 *</label>
                  <select name="degree">
                    <option value="SHOWER">洗护类</option>
                    <option value="BEAUTY">美容类</option>
                  </select>
                </div>
              </div>
              <div class="mt16"><button class="btn" type="submit">新增分类</button></div>
            </form>
          </div>
        </div>
      </div>

      <!-- 价目表：列为全部服务分类（含隐藏，标记不可开单），行为价目行（按排序号） -->
      <div class="card" id="priceMatrix">
        <div class="card-head"><span>价目表</span></div>
        <div class="card-body flush">
          <table class="tbl">
            <thead>
              <tr>
                <th>价目行</th>
                <th th:each="c : ${categories}">
                  <span th:text="${c.name}">精洗</span>
                  <span class="small muted" th:text="' · ' + ${ui.degree(c.degree)}"> · 洗护类</span>
                  <br><span th:unless="${c.isVisible}" class="badge warn">不可开单</span>
                </th>
                <th th:if="${session.sessionUser.isAdmin()}"></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${priceRows}">
                <td>
                  <b th:text="${ui.species(r.animal) + '：' + r.description}">狗：0-3kg</b>
                  <span class="small muted">
                    <span th:if="${r.dogSize}" th:text="' · 肩高 ' + ${r.dogSize}"></span>
                    <span th:if="${r.furLength}" th:text="' · ' + ${r.furLength}"></span>
                    <span th:if="${r.breedTags}" th:text="' · ' + ${r.breedTags}"></span>
                  </span>
                </td>
                <td class="num" th:each="c : ${categories}"
                    th:with="cell=${priceCells.get(r.id)?.get(c.id)}">
                  <button th:if="${session.sessionUser.isAdmin()}" class="btn ghost sm"
                          type="button" data-cell-price
                          th:attr="onclick='document.getElementById(\'cell-edit-' + ${r.id} + '-' + ${c.id} + '\').showModal()'">
                    <span th:text="${cell != null and cell.priceCent > 0} ? ${ui.money(cell.priceCent)} : '—'">—</span>
                    <span class="small muted" th:if="${cell != null and cell.priceCent > 0}"
                          th:text="' ' + ${ui.discount(cell.discountType, cell.discountRate)}"></span>
                  </button>
                  <span th:unless="${session.sessionUser.isAdmin()}" data-cell-price>
                    <span th:text="${cell != null and cell.priceCent > 0} ? ${ui.money(cell.priceCent)} : '—'">—</span>
                    <span class="small muted" th:if="${cell != null and cell.priceCent > 0}"
                          th:text="' ' + ${ui.discount(cell.discountType, cell.discountRate)}"></span>
                  </span>
                  <dialog class="modal" th:id="'cell-edit-' + ${r.id} + '-' + ${c.id}"
                          th:if="${session.sessionUser.isAdmin()}">
                    <form method="post" th:action="@{/services/price-rows/{id}/cells/save(id=${r.id})}">
                      <div class="card-head"><span th:text="'改价：' + ${ui.species(r.animal) + '：' + r.description} + ' · ' + ${c.name}">改价</span></div>
                      <div class="card-body">
                        <input type="hidden" name="categoryId" th:value="${c.id}">
                        <div class="form-grid">
                          <div class="field"><label>价格（元）</label>
                            <input name="priceYuan" inputmode="decimal" placeholder="留空为未定价"
                                   th:value="${cell != null and cell.priceCent > 0} ? ${ui.yuan(cell.priceCent)} : ''"></div>
                          <div class="field"><label>服务折扣</label>
                            <select name="discountType">
                              <option value="GROUP" th:selected="${cell != null and cell.discountType == 'GROUP'}">会员组折扣</option>
                              <option value="FULL" th:selected="${cell == null or cell.discountType == 'FULL'}">全额（10 折）</option>
                              <option value="RATE" th:selected="${cell != null and cell.discountType == 'RATE'}">按折扣率（9/8/7 折或自定义）</option>
                            </select>
                          </div>
                          <div class="field"><label>折扣率</label>
                            <input name="discountRate" inputmode="decimal" placeholder="如 8.5 表示 8.5 折"
                                   th:value="${cell != null and cell.discountType == 'RATE'} ? ${cell.discountRate} : ''"></div>
                        </div>
                        <div class="mt16">
                          <button class="btn" type="submit">保存</button>
                          <button class="btn ghost" type="button"
                                  th:attr="onclick='document.getElementById(\'cell-edit-' + ${r.id} + '-' + ${c.id} + '\').close()'">取消</button>
                        </div>
                      </div>
                    </form>
                  </dialog>
                </td>
                <td class="actions" th:if="${session.sessionUser.isAdmin()}">
                  <button class="btn ghost sm" type="button"
                          th:attr="onclick='document.getElementById(\'row-edit-' + ${r.id} + '\').showModal()'">编辑</button>
                  <form method="post" th:action="@{/services/price-rows/{id}/delete(id=${r.id})}" style="display:inline"
                        onsubmit="return confirmAct('删除该价目行？其下所有价格格子会一并删除。')">
                    <button class="btn danger sm">删除</button>
                  </form>
                  <dialog class="modal" th:id="'row-edit-' + ${r.id}">
                    <form method="post" th:action="@{/services/price-rows/save}">
                      <div class="card-head"><span>编辑价目行</span></div>
                      <div class="card-body">
                        <input type="hidden" name="id" th:value="${r.id}">
                        <div class="form-grid">
                          <div class="field"><label>宠物类型 *</label>
                            <select name="animal">
                              <option value="DOG" th:selected="${r.animal == 'DOG'}">狗</option>
                              <option value="CAT" th:selected="${r.animal == 'CAT'}">猫</option>
                            </select></div>
                          <div class="field"><label>描述 *</label><input name="description" required th:value="${r.description}"></div>
                          <div class="field"><label>肩高分段（高级标签）</label><input name="dogSize" th:value="${r.dogSize}" placeholder="如 S,M"></div>
                          <div class="field"><label>毛长（高级标签）</label><input name="furLength" th:value="${r.furLength}" placeholder="如 短毛"></div>
                          <div class="field"><label>品种（高级标签）</label><input name="breedTags" th:value="${r.breedTags}" placeholder="如 泰迪,比熊"></div>
                          <div class="field"><label>排序号（小的在前）</label><input type="number" name="sortNo" th:value="${r.sortNo}"></div>
                        </div>
                        <div class="mt16">
                          <button class="btn" type="submit">保存</button>
                          <button class="btn ghost" type="button"
                                  th:attr="onclick='document.getElementById(\'row-edit-' + ${r.id} + '\').close()'">取消</button>
                        </div>
                      </div>
                    </form>
                  </dialog>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(priceRows)}">
                <td th:attr="colspan=${#lists.size(categories) + 2}" class="muted">还没有价目行</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" th:if="${session.sessionUser.isAdmin()}">
          <form method="post" th:action="@{/services/price-rows/save}" class="inline-form" id="rowCreate">
            <div class="form-grid">
              <div class="field"><label>宠物类型 *</label>
                <select name="animal">
                  <option value="DOG">狗</option>
                  <option value="CAT">猫</option>
                </select></div>
              <div class="field"><label>描述 *</label><input name="description" required placeholder="0-3kg / 5kg 短毛"></div>
              <div class="field"><label>肩高分段（高级标签）</label><input name="dogSize" placeholder="如 S,M"></div>
              <div class="field"><label>毛长（高级标签）</label><input name="furLength" placeholder="如 短毛"></div>
              <div class="field"><label>品种（高级标签）</label><input name="breedTags" placeholder="如 泰迪,比熊"></div>
              <div class="field"><label>排序号（小的在前）</label><input type="number" name="sortNo" value="0"></div>
            </div>
            <div class="mt16"><button class="btn" type="submit">新增价目行</button></div>
          </form>
        </div>
      </div>

      <div class="grid-form-list">
        <div class="card" th:if="${session.sessionUser.isAdmin()}">
          <div class="card-head"><span>＋ 新增服务项目</span></div>
          <div class="card-body">
            <form method="post" th:action="@{/services/save}">
              <div class="form-grid">
                <div class="field"><label>名称 *</label><input name="name" required placeholder="精洗 / 剪毛造型 / 药浴"></div>
                <div class="field"><label>标准耗时（分钟）</label><input type="number" name="durationMin" value="60" min="1"></div>
                <div class="field"><label>小型价（元）</label><input name="priceS" value="0"></div>
                <div class="field"><label>中型价（元）</label><input name="priceM" value="0"></div>
                <div class="field"><label>大型价（元）</label><input name="priceL" value="0"></div>
                <div class="field"><label>巨型价（元）</label><input name="priceXL" value="0"></div>
                <div class="field"><label>排序号（小的在前）</label><input type="number" name="sortNo" value="0"></div>
              </div>
              <div class="mt16"><button class="btn" type="submit">保存</button></div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span>已配置项目</span></div>
          <div class="card-body flush">
            <table class="tbl">
              <thead><tr><th>名称</th><th class="num">小</th><th class="num">中</th><th class="num">大</th><th class="num">巨型</th><th>耗时</th><th>状态</th><th></th></tr></thead>
              <tbody>
                <tr th:each="s : ${items}">
                  <td><b th:text="${s.name}"></b></td>
                  <td class="num" th:text="${ui.yuan(s.priceSCent)}"></td>
                  <td class="num" th:text="${ui.yuan(s.priceMCent)}"></td>
                  <td class="num" th:text="${ui.yuan(s.priceLCent)}"></td>
                  <td class="num" th:text="${ui.yuan(s.priceXLCent)}"></td>
                  <td class="small" th:text="${s.durationMin} + ' 分钟'"></td>
                  <td><span class="badge" th:classappend="${s.isActive} ? 'ok' : 'muted'" th:text="${s.isActive} ? '在售' : '已下架'"></span></td>
                  <td>
                    <form method="post" th:action="@{/services/{id}/toggle(id=${s.id})}" style="display:inline"
                          th:if="${session.sessionUser.isAdmin()}"
                          onsubmit="return confirmAct('切换服务上下架？')">
                      <input type="hidden" name="active" th:value="${s.isActive} ? 'false' : 'true'">
                      <button class="btn ghost sm" th:text="${s.isActive} ? '下架' : '上架'"></button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="muted">还没有服务项目</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <p class="small muted">体型档位规则：&lt;10kg 小 · 10–25kg 中 · 25–40kg 大 · ≥40kg 巨型（边界取大档）。</p>
    </div>
  </div>
</div>
</body>
</html>
