<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('开单收银')"></head>
<body>
<div class="layout">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/header :: header"></header>
    <div class="content">
      <div th:replace="fragments/header :: flash"></div>
      <h1 class="page-title">开单收银 · <span th:text="${customer.name}"></span>
        <span class="sub" th:text="${customer.phone}"></span>
        <a class="btn ghost sm" th:href="@{/customers/{id}(id=${customer.id})}">客户档案</a>
      </h1>

      <form method="post" th:action="@{/bills/settle}" id="settleForm" onsubmit="return submitForm(this)">
        <input type="hidden" name="customerId" th:value="${customer.id}">
        <input type="hidden" name="requestId" th:value="${requestId}">
        <input type="hidden" name="itemsJson" id="itemsJson" value="[]">
        <input type="hidden" name="appointmentId" id="appointmentId" th:value="${appointmentId}">

        <div class="pos-wrap">
          <div class="pos-left">
            <div class="card">
              <div class="card-head"><span><i data-lucide="dog"></i> 选择宠物（含服务项时必须选择）</span></div>
              <div class="card-body">
                <div class="pick-grid" id="petPick"></div>
                <div class="hint mt8" id="petHint"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><span><i data-lucide="scissors"></i> 服务（按价目表选 / 美容单项）</span>
                <span class="muted small" style="margin-left:auto"
                      th:text="'会员组：' + ${data.memberGroupName} + '（' + ${data.memberGroupRate / 10.0} + ' 折）'"></span>
              </div>
              <div class="card-body">
                <div class="flex" style="gap:8px;align-items:center;flex-wrap:wrap">
                  <b class="small">按价目表选</b>
                  <select id="priceRowSel" onchange="onPriceRowChange()" style="max-width:240px">
                    <option value="">选择价目行…</option>
                    <th:block th:each="r : ${data.priceRows}"><option th:value="${r.id}" th:text="${r.label}"
                            th:attr="'data-price-cells'=${r.categoryIds}"></option></th:block>
                  </select>
                  <div class="pick-grid" id="priceCellPick" style="flex:1"></div>
                </div>
                <div class="hint mt8" id="priceHint">先选价目行，再点分类格子把服务加入明细</div>
                <div class="flex" style="gap:8px;align-items:center;margin-top:12px">
                  <b class="small">美容单项</b>
                  <div class="pick-grid" style="flex:1">
                    <button type="button" class="pick" th:each="b : ${data.beautyItems}"
                            th:onclick="'addBeauty(' + ${b.id} + ')'">
                      <b th:text="${b.name}"></b>
                      <span th:text="${b.categoryName} + ' · ¥' + ${ui.yuan(b.priceCent)} + '（' + ${b.discountLabel} + '）'"></span>
                    </button>
                    <span class="muted small" th:if="${#lists.isEmpty(data.beautyItems)}">暂无可在收银台售卖的美容单项</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><span><i data-lucide="package"></i> 商品</span>
                <input type="text" id="barcodeInput" placeholder="扫码枪对准此处 / 输入条码回车"
                       style="width:220px;margin-left:auto" autocomplete="off">
              </div>
              <div class="card-body">
                <div class="pick-grid">
                  <button type="button" class="pick" th:each="p : ${data.products}"
                          th:onclick="'addProduct(' + ${p.id} + ')'">
                    <b th:text="${p.name}"></b>
                    <span th:text="'¥' + ${ui.yuan(p.salePriceCent)} + ' · 库存 ' + ${p.stockQty}"></span>
                  </button>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><span><i data-lucide="receipt-text"></i> 明细</span></div>
              <div class="card-body flush" id="lineBox">
                <div class="pos-line muted" id="emptyLine">还没选项目，点上方卡片加入明细</div>
              </div>
            </div>
          </div>

          <div class="pos-right">
            <div class="card">
              <div class="card-head"><span><i data-lucide="wallet"></i> 结账</span></div>
              <div class="card-body">
                <div class="sum-row"><span class="muted">明细合计</span><b id="sumSub">¥0.00</b></div>
                <div class="sum-row"><span class="muted">次卡抵扣</span><b id="sumCard">¥0.00</b></div>
                <div class="sum-row"><span class="muted">服务折扣（行折扣）</span><b id="sumLineDisc">-¥0.00</b></div>
                <div class="field mt8">
                  <label>整单折扣（元）</label>
                  <input type="text" id="discountYuan" name="discountYuan" value="0" oninput="recalc()">
                  <div class="hint">整单优惠，与上面的行折扣分开记录；按行折后金额占比分摊，尾差归金额最大的一条</div>
                </div>
                <div class="sum-row"><span class="muted">整单优惠</span><b id="sumBillDisc">-¥0.00</b></div>
                <div class="sum-row total"><span>应收</span><span id="sumRecv">¥0.00</span></div>
                <div class="field mt8">
                  <label>收款方式 *</label>
                  <select name="payMethod" required>
                    <option value="CASH">现金</option>
                    <option value="WECHAT">微信</option>
                    <option value="ALIPAY">支付宝</option>
                    <option value="BANK_CARD">银行卡</option>
                    <option value="OTHER">其他</option>
                  </select>
                </div>
                <div class="field">
                  <label>备注</label>
                  <input type="text" name="remark" placeholder="选填">
                </div>
                <button class="btn lg" type="submit" id="submitBtn" style="width:100%"><i data-lucide="check"></i> 提交结账</button>
                <div class="hint mt8" id="formErr" style="color:var(--danger)"></div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 放在 data-* 属性里：属性值经 HTML 转义后由浏览器还原，避免 <script> raw text 中 &quot; 不解码导致 JSON.parse 失败 -->
<div id="dataTag" th:attr="data-json=${dataJson}" style="display:none"></div>
<input type="hidden" id="apptServiceId" th:value="${appointment != null} ? ${appointment.serviceId} : ''">
<input type="hidden" id="apptPetId" th:value="${appointment != null} ? ${appointment.petId} : ''">
<script>
var DATA = JSON.parse(document.getElementById('dataTag').getAttribute('data-json') || '{}');

/* v1.1：扫码开单（FR-M10-01） */
document.addEventListener('DOMContentLoaded', function () {
  var bar = document.getElementById('barcodeInput');
  if (!bar) return;
  bar.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var code = bar.value.trim();
    if (!code) return;
    var hit = null;
    (DATA.products || []).forEach(function (p) {
      if (p.barcode && p.barcode === code) hit = p;
    });
    if (hit) { addProduct(hit.id); bar.value = ''; }
    else { document.getElementById('formErr').textContent = '条码未找到商品：' + code + '（可手动点选加入）'; }
    bar.focus();
  });
});
</script>
<script>
/* 开单页逻辑：纯前端计算，提交时服务端重算 */
var lines = [];  // {key, type, refId, name, petId, petName, tier, qty, price, cardId, cardNo}
var lineSeq = 0;

function pets() { return DATA.pets || []; }
function products() { return DATA.products || []; }
function priceRows() { return DATA.priceRows || []; }
function beautyItems() { return DATA.beautyItems || []; }
function categories() { return DATA.categories || []; }
function cards() { return DATA.cards || []; }
function prodById(id) { for (var i = 0; i < products().length; i++) if (products()[i].id === id) return products()[i]; return null; }
function petById(id) { for (var i = 0; i < pets().length; i++) if (pets()[i].id === id) return pets()[i]; return null; }
function rowById(id) { for (var i = 0; i < priceRows().length; i++) if (priceRows()[i].id === id) return priceRows()[i]; return null; }
function beautyById(id) { for (var i = 0; i < beautyItems().length; i++) if (beautyItems()[i].id === id) return beautyItems()[i]; return null; }
function catName(id) { var cs = categories(); for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i].name; return ''; }
function cardRemain(c) { return c.paidQty - c.usedPaid + c.giftQty - c.usedGift; }

function renderPets() {
  var box = document.getElementById('petPick');
  box.innerHTML = '';
  var list = pets();
  if (!list.length) {
    box.innerHTML = '<span class="muted small">该客户还没有宠物，可先去档案页添加</span>';
    return;
  }
  list.forEach(function (p) {
    if (!p.isActive) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick';
    btn.setAttribute('data-pet', p.id);
    btn.innerHTML = '<b>' + escHtml(p.name) + '</b><span>' +
      (p.species === 'CAT' ? '猫' : (p.species === 'DOG' ? '狗' : '其他')) +
      (p.breed ? ' · ' + escHtml(p.breed) : '') +
      ' · ' + (p.weightG ? (p.weightG / 1000) + 'kg' : '未录体重') + '</span>';
    btn.onclick = function () { selectPet(p.id); };
    box.appendChild(btn);
  });
  if (list.filter(function (p) { return p.isActive; }).length === 1) {
    selectPet(list.filter(function (p) { return p.isActive; })[0].id);
  }
}

function selectPet(id) {
  document.querySelectorAll('[data-pet]').forEach(function (el) { el.style.borderColor = ''; });
  var el = document.querySelector('[data-pet="' + id + '"]');
  if (el) el.style.borderColor = 'var(--primary)';
  window._selPet = id;
  var p = petById(id);
  document.getElementById('petHint').textContent = '已选 ' + p.name + '：服务行默认记在它名下';
  lines.forEach(function (l) {
    if (l.type === 'SERVICE' && !l.petId) { l.petId = id; }
  });
  render();
}

/* 价目表选：先选价目行，再点该行的分类格子 */
function onPriceRowChange() {
  var sel = document.getElementById('priceRowSel');
  var row = rowById(parseInt(sel.value, 10));
  var box = document.getElementById('priceCellPick');
  box.innerHTML = '';
  var hint = document.getElementById('priceHint');
  if (!row) { hint.textContent = '先选价目行，再点分类格子把服务加入明细'; return; }
  var any = false;
  categories().forEach(function (c) {
    var cell = row.cells && row.cells[String(c.id)];
    if (!cell) return; // 该分类下未定价
    any = true;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick';
    btn.innerHTML = '<b>' + escHtml(c.name) + '</b><span>¥' + fmtYuan(cell.priceCent) +
      '（' + escHtml(cell.discountLabel) + ' → ¥' + fmtYuan(cell.dealCent) + '）</span>';
    btn.onclick = function () { addPrice(row.id, c.id); };
    box.appendChild(btn);
  });
  hint.textContent = any ? row.label + '：点分类格子加入明细' : row.label + ' 下还没有定价的分类';
}

function addPrice(rowId, categoryId) {
  if (!requirePet()) return;
  var row = rowById(rowId);
  var cell = row.cells[String(categoryId)];
  var petId = window._selPet || pets()[0].id;
  lines.push({ key: ++lineSeq, type: 'SERVICE', source: 'PRICE', refId: row.id,
               refLabel: row.label, categoryId: categoryId, categoryIds: row.categoryIds || [],
               name: row.label + ' · ' + catName(categoryId), petId: petId,
               listPrice: cell.priceCent, price: cell.dealCent, deal: cell.dealCent,
               manual: false, cardId: null });
  render();
}

function addBeauty(id) {
  var b = beautyById(id);
  if (!b) return;
  if (!requirePet()) return;
  var petId = window._selPet || pets()[0].id;
  lines.push({ key: ++lineSeq, type: 'SERVICE', source: 'BEAUTY', refId: b.id,
               categoryId: null, refIds: [b.id],
               name: b.name + (b.categoryName ? ' · ' + b.categoryName : ''), petId: petId,
               listPrice: b.priceCent, price: b.dealCent, deal: b.dealCent,
               manual: false, cardId: null });
  render();
}

function requirePet() {
  if (pets().length === 0) { alert('该客户还没有宠物，含服务项必须选择宠物'); return false; }
  return true;
}

function addProduct(id) {
  var p = prodById(id);
  if (!p) return;
  // 已有同商品行 +1
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].type === 'PRODUCT' && lines[i].refId === id) { lines[i].qty++; render(); return; }
  }
  lines.push({ key: ++lineSeq, type: 'PRODUCT', refId: id, name: p.name, petId: null,
               qty: 1, price: p.salePriceCent, cardId: null });
  render();
}

function chgPrice(key, yuan) {
  var l = find(key); if (!l) return;
  var cent = toCent(yuan);
  if (cent > l.listPrice) { alert('手工改价不能高于价目价格 ¥' + fmtYuan(l.listPrice) + '，调价请改价目表'); cent = l.deal; }
  if (cent < 0) cent = 0;
  l.manual = cent !== l.deal;
  l.price = cent;
  render();
}
function resetPrice(key) { var l = find(key); if (!l) return; l.price = l.deal; l.manual = false; render(); }
function chgQty(key, qty) { var l = find(key); l.qty = Math.max(1, parseInt(qty || '1', 10)); if (l.cardId && l.qty !== 1) { l.cardId = null; } render(); }
function chgPet(key, petId) { var l = find(key); l.petId = parseInt(petId, 10) || null; render(); }
function chgCard(key, cardId) { var l = find(key); l.cardId = cardId ? parseInt(cardId, 10) : null; render(); }
function delLine(key) { lines = lines.filter(function (l) { return l.key !== key; }); render(); }

function find(key) {
  for (var i = 0; i < lines.length; i++) if (lines[i].key === key) return lines[i];
  return null;
}

function amountOf(l) { return l.price * l.qty; }
function lineDiscountOf(l) { return (l.listPrice - l.price) * l.qty; }

function recalc() {
  var sub = 0, cardAmt = 0, lineDisc = 0;
  lines.forEach(function (l) {
    if (l.cardId) { cardAmt += amountOf(l); }
    else { sub += amountOf(l); lineDisc += lineDiscountOf(l); }
  });
  var disc = toCent(document.getElementById('discountYuan').value);
  var err = '';
  if (disc > sub) { err = '整单折扣不能大于明细金额（不含次卡抵扣部分）'; disc = sub; }
  var recv = sub - disc;
  document.getElementById('sumSub').textContent = '¥' + fmtYuan(sub + cardAmt);
  document.getElementById('sumCard').textContent = '¥' + fmtYuan(cardAmt);
  document.getElementById('sumLineDisc').textContent = '-¥' + fmtYuan(lineDisc);
  document.getElementById('sumBillDisc').textContent = '-¥' + fmtYuan(disc);
  document.getElementById('sumRecv').textContent = '¥' + fmtYuan(recv);
  document.getElementById('formErr').textContent = err;
  return { sub: sub, cardAmt: cardAmt, recv: recv };
}

function render() {
  var box = document.getElementById('lineBox');
  var empty = document.getElementById('emptyLine');
  if (!lines.length) { empty.style.display = ''; box.querySelectorAll('.pos-line[data-key]').forEach(function (e) { e.remove(); }); recalc(); return; }
  empty.style.display = 'none';
  box.querySelectorAll('.pos-line[data-key]').forEach(function (e) { e.remove(); });
  lines.forEach(function (l) {
    var div = document.createElement('div');
    div.className = 'pos-line';
    div.setAttribute('data-key', l.key);
    var discTxt = l.type === 'SERVICE' && lineDiscountOf(l) > 0
      ? ' · 行折扣 ¥' + fmtYuan(lineDiscountOf(l)) : '';
    var left = '<div class="nm">' + escHtml(l.name) + (l.type === 'SERVICE' ? ' <span class="badge primary">服务</span>' : ' <span class="badge muted">商品</span>') +
      '<div class="meta">¥' + fmtYuan(l.price) + ' × ' + l.qty + discTxt + '</div></div>';
    var petSel;
    if (l.type === 'SERVICE') {
      var opts = pets().filter(function (p) { return p.isActive; }).map(function (p) {
        return '<option value="' + p.id + '"' + (l.petId === p.id ? ' selected' : '') + '>' + escHtml(p.name) + '</option>';
      }).join('');
      petSel = '<select onchange="chgPet(' + l.key + ', this.value)">' + opts + '</select>';
    } else {
      petSel = '<span class="muted small">—</span>';
    }
    var priceCell;
    if (l.type === 'SERVICE') {
      priceCell = '<div><input type="number" min="0" step="0.01" value="' + fmtYuan(l.price) + '" title="成交价（可手改）" onchange="chgPrice(' + l.key + ', this.value)"' +
        (l.cardId ? ' disabled' : '') + '>' +
        (l.manual ? '<a href="javascript:void(0)" class="small" onclick="resetPrice(' + l.key + ')">恢复价目价</a>' : '') + '</div>';
    } else { priceCell = '<span></span>'; }
    var cardSel;
    if (l.type === 'SERVICE' && cards().length) {
      var usable = cards().filter(function (c) {
        if (!c.serviceIds) return true; // 不限服务
        var ids = String(c.serviceIds).split(',');
        var refs = l.refIds || [l.refId];
        return refs.some(function (id) { return ids.indexOf(String(id)) >= 0; });
      });
      if (usable.length) {
        var copts = '<option value="">收现金</option>' + usable.map(function (c) {
          return '<option value="' + c.id + '"' + (l.cardId === c.id ? ' selected' : '') + '>' + escHtml(c.cardNo) + ' 剩' + cardRemain(c) + '次</option>';
        }).join('');
        cardSel = '<select onchange="chgCard(' + l.key + ', this.value)">' + copts + '</select>';
      } else { cardSel = '<span class="muted small">无可用卡</span>'; }
    } else { cardSel = '<span></span>'; }
    div.innerHTML = left +
      '<div>' + petSel + '</div>' +
      '<div>' + priceCell + '</div>' +
      '<div>' + cardSel + '</div>' +
      '<div style="display:flex;gap:4px"><input type="number" min="1" value="' + l.qty + '" style="width:56px" onchange="chgQty(' + l.key + ', this.value)">' +
      '<button type="button" class="pos-del" onclick="delLine(' + l.key + ')"><i data-lucide="x"></i></button></div>';
    // 布局为 5 列：名称/宠物/成交价/卡/数量
    div.style.gridTemplateColumns = '1fr 100px 120px 150px 110px';
    box.appendChild(div);
  });
  recalc();
  // 动态插入的行里有 data-lucide 图标，补一次渲染
  if (window.lucide && typeof lucide.createIcons === 'function') {
    lucide.createIcons();
  }
}

function submitForm(f) {
  // 校验
  var err = document.getElementById('formErr');
  if (!lines.length) { err.textContent = '明细不能为空：请先点选服务或商品'; return false; }
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].type === 'SERVICE' && !lines[i].petId) { err.textContent = '含服务项目时必须选择宠物'; return false; }
  }
  var r = recalc();
  if (err.textContent) return false;
  // 组装 itemsJson：服务行带来源与分类，手改价时带 unitPriceCent（服务端会重算并校验）
  var items = lines.map(function (l) {
    var it = { itemType: l.type, refId: l.refId, petId: l.petId, cardId: l.cardId, qty: l.qty };
    if (l.type === 'SERVICE') {
      it.itemSource = l.source;
      it.categoryId = l.categoryId;
      it.unitPriceCent = l.price;
    }
    return it;
  });
  document.getElementById('itemsJson').value = JSON.stringify(items);
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';
  return true; // 提交
}

renderPets();
render();

/* v1.1 F9：预约到店转开单——预填宠物与服务项 */
(function () {
  var sid = parseInt(document.getElementById('apptServiceId').value, 10);
  var pid = parseInt(document.getElementById('apptPetId').value, 10);
  if (sid && pid) {
    selectPet(pid);
    if (beautyById(sid)) { addBeauty(sid); } else { alert('预约服务不是美容单项，请手动选择价目格子'); }
    if (document.getElementById('formErr')) {
      document.getElementById('formErr').textContent = '已带入预约服务，请核对明细后结账';
      document.getElementById('formErr').style.color = 'var(--primary)';
    }
  }
})();
</script>
</body>
</html>
